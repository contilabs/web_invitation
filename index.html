<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Tema (día / noche) antes de pintar y antes que cualquier estilo, para que no parpadee.
         Es la única resolución inicial del tema: React (T9/T12) reutiliza lo que se deja aquí
         en `data-tema` / `localStorage["kg-tema"]`, no vuelve a resolverlo. -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("kg-tema");
        } catch (e) {}
        if (tema !== "dia" && tema !== "noche") {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "noche"
            : "dia";
        }
        if (tema === "noche") document.documentElement.classList.add("dark-mode");
        document.documentElement.dataset.tema = tema;
      })();
    </script>

    <title>Naomi y Andrés</title>
    <meta
      name="description"
      content="Naomi y Andrés te invitan a celebrar su boda el 13 de marzo de 2027 en San Juan de los Lagos, Jalisco, México. Confirma tu asistencia."
    />
    <meta name="theme-color" content="#f3efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#20261d" media="(prefers-color-scheme: dark)" />

    <!-- Cómo se ve el enlace al compartirlo por WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Naomi y Andrés" />
    <meta
      property="og:description"
      content="Naomi y Andrés te invitan a celebrar su boda el 13 de marzo de 2027 en San Juan de los Lagos, Jalisco, México. Confirma tu asistencia."
    />
    <meta property="og:image" content="assets/photos/opt/hero-naomi-andres-1800.jpg" />
    <meta property="og:image:alt" content="Naomi y Andrés" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="2700" />

    <link rel="icon" href="assets/icons/wax-seal.ico" type="image/x-icon" sizes="256x256" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="/src/templates/classic/classic.css" />
    <link rel="stylesheet" href="/src/templates/classic/classic-dark.css" />
  </head>
