<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Tema (día / noche) antes de pintar y antes que cualquier estilo, para que no parpadee.
         Es la única resolución inicial del tema: React (T9/T12) reutiliza lo que se deja aquí
         en `data-tema` / `localStorage["kg-tema"]`, no vuelve a resolverlo. -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("kg-tema");
        } catch (e) {}
        if (tema !== "dia" && tema !== "noche") {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "noche"
            : "dia";
        }
        if (tema === "noche") document.documentElement.classList.add("dark-mode");
        document.documentElement.dataset.tema = tema;
      })();
    </script>

    <title>Invitación de Boda | Karina &amp; Gerardo</title>
    <meta
      name="description"
      content="Karina y Gerardo te invitan a celebrar su boda el 1 de noviembre de 2027 en Guadalajara. Confirma tu asistencia."
    />
    <meta name="theme-color" content="#f0ebe0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)" />

    <!-- Cómo se ve el enlace al compartirlo por WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Karina &amp; Gerardo — 01 de noviembre de 2027" />
    <meta
      property="og:description"
      content="Tenemos el placer de invitarlos a nuestra boda en Guadalajara."
    />
    <meta property="og:image" content="assets/photos/opt/foto2-1800.jpg" />

    <link rel="icon" href="assets/icons/sello.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="darkMode.css" />
  </head>

  <body>
    <!-- Respaldo para quien llega sin JavaScript: la app no monta, así que se avisa. -->
    <noscript>
      <div class="wrap">
        <p>
          Esta invitación necesita JavaScript para verse. Actívalo en tu navegador y vuelve a
          cargar la página.
        </p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
